[project]
name = "ingest"
version = "0.1.0"
description = "Flexible, performant RAG ingest system with LanceDB, directory watching, REST, and MCP"
readme = "README.md"
authors = [
    { name = "Jeremy Dyer", email = "jdyer@nvidia.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lancedb>=0.37.1",
    "lxml>=6.1.1",
    "mcp>=2.0.0",
    "numpy>=2.5.2",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.3",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
ingest = "ingest.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
