services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DB: ingest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://ingest:ingest@postgres:5432/ingest
      LANCEDB_PATH: /data/lancedb
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 8080
      EMBEDDER_PROVIDER: deterministic
      WATCH_PATHS: /watch
    volumes:
      - ./data:/data
      - ./watch_sample:/watch
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
